strategy:
  id: "gap_fill"
  name: "Gap Fill"
  version: 1
  description: "Trade the mean reversion of overnight gaps. Stocks that gap up/down often fill the gap within the session. Edge: gaps > 1% and < 3% have ~65% fill rate historically."
  author: "library"
  active: true
  is_library: true

  market_regime:
    preferred:
      - ranging
      - mean_reverting
    neutral:
      - high_volatility
    avoid:
      - trending_bullish
      - trending_bearish
      - breakout

  entry:
    direction: any
    time_window:
      start: "09:20"
      end: "10:00"
    confirmations:
      - type: "gap_detected"
        required: true
        weight: 2.0
        description: "Gap 1-3% from prior close"
        params:
          min_gap_pct: 1.0
          max_gap_pct: 3.0
      - type: "gap_fill_momentum"
        required: true
        weight: 1.5
        description: "First candle shows reversal toward gap fill"
        params: {}
      - type: "sector_confirmation"
        required: false
        weight: 1.0
        description: "Sector index not gapping in same direction"
        params: {}
    avoid_conditions:
      - type: "news_catalyst"
        description: "Gap caused by earnings/results — gaps may extend"
        params: {}
      - type: "large_gap"
        description: "Gap > 3% — structural shift, not mean reversion"
        params:
          max_gap_pct: 3.0

  exit:
    stop_loss:
      type: "fixed"
      params:
        points_beyond_gap: 0.3
    targets:
      - r_multiple: 1.0
        size_pct: 70
      - r_multiple: 2.0
        size_pct: 30
    trailing:
      enabled: false
      type: ""
      activate_at_r: 1.0
      params: {}
    time_exit:
      enabled: true
      max_duration_minutes: 75
      close_before: "10:45"

  risk:
    max_risk_pct: 0.75
    min_r_target: 1.0
    max_daily_trades: 2
    max_daily_loss_pct: 1.5

  execution:
    entry_type: "market"
    preferred_timeframe: "5m"
    notes: "Time-sensitive — must enter within first 30 min. Exit by 10:45 regardless."

  invalidation:
    - type: "gap_extension"
      description: "Price extends gap by > 0.5% — fill not happening"
      params:
        extension_pct: 0.5
