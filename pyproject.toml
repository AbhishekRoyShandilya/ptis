[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ptis"
version = "0.2.0"
description = "Personal Trading Intelligence System — Behavioral trading intelligence with strategy attribution"
requires-python = ">=3.9"
license = {text = "Proprietary"}

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
]
ml = [
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
]
broker = [
    "kiteconnect>=5.0.0",
]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = [
    "api*", "core*", "strategy_engine*", "analytics*", "behavioral*",
    "agents*", "automation*", "intelligence*", "shadow*", "ske*",
    "discovery*", "bootstrap*", "coplanner*", "avt*", "config*",
]
