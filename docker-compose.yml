# docker-compose.yml
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ptis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ptis}
      POSTGRES_DB: ${POSTGRES_DB:-ptis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ptis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ptis}:${POSTGRES_PASSWORD:-ptis}@db:5432/${POSTGRES_DB:-ptis}
      PTIS_JWT_SECRET: ${PTIS_JWT_SECRET:?Set PTIS_JWT_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      DEBUG: ${DEBUG:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/strategies:/app/config/strategies
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"
    # Entrypoint in Dockerfile handles: migrations -> seed -> uvicorn

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: python worker.py
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ptis}:${POSTGRES_PASSWORD:-ptis}@db:5432/${POSTGRES_DB:-ptis}
      PTIS_JWT_SECRET: ${PTIS_JWT_SECRET:?Set PTIS_JWT_SECRET in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config/strategies:/app/config/strategies
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  pgdata:
